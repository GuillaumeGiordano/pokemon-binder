# Build-script approval, same setup as the other projects: newer pnpm reads
# onlyBuiltDependencies / ignoredBuiltDependencies, older pnpm reads allowBuilds.
# @guillaumeg/ui ships a precompiled `package/` folder → its build is skipped.

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - esbuild
  - prisma

ignoredBuiltDependencies:
  - "@guillaumeg/ui"
  - "@parcel/watcher"

allowBuilds:
  "@guillaumeg/ui": false
  "@parcel/watcher": false
  "@prisma/engines": true
  esbuild: true
  prisma: true

verifyDepsBeforeRun: false
